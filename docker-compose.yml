services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-taskflow}
      POSTGRES_USER: ${DB_USER:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskflow}
    volumes:
      - taskflow_pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-taskflow} -d ${DB_NAME:-taskflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskflow-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-taskflow}
      DB_USER: ${DB_USER:-taskflow}
      DB_PASSWORD: ${DB_PASSWORD:-taskflow}
      TASKFLOW_WORKER_POOL_SIZE: ${TASKFLOW_WORKER_POOL_SIZE:-6}
      TASKFLOW_SCHEDULER_POLL_INTERVAL_MS: ${TASKFLOW_SCHEDULER_POLL_INTERVAL_MS:-500}
      TASKFLOW_SCHEDULER_BATCH_SIZE: ${TASKFLOW_SCHEDULER_BATCH_SIZE:-10}
      TASKFLOW_RETRY_INITIAL_DELAY_SECONDS: ${TASKFLOW_RETRY_INITIAL_DELAY_SECONDS:-2}
      TASKFLOW_RETRY_MAX_DELAY_SECONDS: ${TASKFLOW_RETRY_MAX_DELAY_SECONDS:-60}
      TASKFLOW_RETRY_MAX_ATTEMPTS: ${TASKFLOW_RETRY_MAX_ATTEMPTS:-3}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      start_period: 25s
      retries: 3
    networks:
      - taskflow-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PORT:-5173}:80"
    networks:
      - taskflow-network

volumes:
  taskflow_pgdata:
    driver: local

networks:
  taskflow-network:
    driver: bridge
